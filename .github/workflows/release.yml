name: Build and release macOS app
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app (minimum macOS 11)
        run: |
          chmod +x scripts/build-app.sh
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/OceanForge.app OceanForge-macOS.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OceanForge-macOS
          path: OceanForge-macOS.zip
          retention-days: 14
      - name: Publish downloadable macOS app
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
          name: OceanForge macOS app
          files: OceanForge-macOS.zip
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
